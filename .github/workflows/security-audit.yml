name: Weekly security audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: npm audit
        id: audit
        run: npm audit --audit-level=high

      - name: Scan full history for secret/PHI patterns
        if: always()
        run: |
          for f in $(git ls-files); do
            case "$f" in
              *.png|*.jpg|*.jpeg|*.gif|*.ico|*.woff|*.woff2|*.ttf) continue ;;
            esac
            grep -lE '\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b|-----BEGIN (RSA |EC )?PRIVATE KEY-----|\bAKIA[0-9A-Z]{16}\b' "$f" 2>/dev/null && echo "::error file=$f::possible PHI/secret pattern"
          done

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly security audit failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The scheduled security-audit workflow failed. See the run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["security"],
            });
