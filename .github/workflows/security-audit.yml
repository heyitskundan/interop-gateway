name: Weekly security audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: npm audit
        id: audit
        run: npm audit --audit-level=high

      - name: Scan full history for secret/PHI patterns
        if: always()
        # Same four patterns scripts/check-secrets.mjs blocks at commit time (SSN, MRN,
        # private key, AWS key) — this is the defense-in-depth sweep for anything that
        # slipped past that hook (e.g. a --no-verify commit). A line ending in the
        # synthetic-pattern-for-detection-test marker is excluded first — the same
        # exemption check-secrets.mjs makes, for test fixtures that intentionally
        # contain a synthetic pattern to verify the detection logic itself.
        run: |
          found=0
          for f in $(git ls-files); do
            case "$f" in
              *.png|*.jpg|*.jpeg|*.gif|*.ico|*.woff|*.woff2|*.ttf) continue ;;
            esac
            if grep -v 'synthetic-pattern-for-detection-test' "$f" 2>/dev/null | grep -qiE '\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b|\bMRN[: #]*[0-9]{6,10}\b|-----BEGIN (RSA |EC )?PRIVATE KEY-----|\bAKIA[0-9A-Z]{16}\b'; then
              echo "::error file=$f::possible PHI/secret pattern"
              found=1
            fi
          done
          exit "$found"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly security audit failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The scheduled security-audit workflow failed. See the run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["security"],
            });
