name: Deploy demo + docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Explicit dependency order, not --workspaces (which iterates workspaces in
      # whatever order npm/the OS happens to discover them, not topological order) —
      # engine and mcp import type declarations from core/protocol/connector, so
      # building out of order fails with "cannot find module" for whichever dependency
      # wasn't built yet. client is built separately below with GITHUB_PAGES set, so
      # it's excluded here.
      - run: npm run build -w packages/core -w packages/protocol -w packages/secrets -w packages/connector -w packages/engine -w packages/mcp

      - run: npm run test -w packages/core -w packages/protocol -w packages/secrets -w packages/connector -w packages/engine -w packages/mcp -w client

      - run: npm run build -w client
        env:
          GITHUB_PAGES: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
